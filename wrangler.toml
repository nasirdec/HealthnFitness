name = "healthnfitness"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Static front-end (public/) is served by Workers Static Assets; /api/* goes to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "healthnfitness"
# Replace with the id printed by: npx wrangler d1 create healthnfitness
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Model used for food/scale/lab/report extraction and insights.
CLAUDE_MODEL = "claude-opus-5-5"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   APP_TOKEN          - the password/bearer token for the app and API
#   ANTHROPIC_API_KEY  - your Claude API key (needed for photo/PDF/description extraction)
