<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Health & Fitness</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card narrow">
      <h1>Health &amp; Fitness</h1>
      <p class="muted">Enter your app token (the <code>APP_TOKEN</code> secret).</p>
      <input id="login-token" type="password" autocomplete="current-password" placeholder="App token" required />
      <button class="primary" type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">Health &amp; Fitness</div>
      <nav id="tabs">
        <button data-tab="today" class="active">Today</button>
        <button data-tab="food">Food</button>
        <button data-tab="exercise">Exercise</button>
        <button data-tab="body">Body</button>
        <button data-tab="vitals">Vitals</button>
        <button data-tab="labs">Blood tests</button>
        <button data-tab="goals">Goals</button>
        <button data-tab="trends">Trends</button>
        <button data-tab="insights">Insights</button>
        <button data-tab="settings">Settings</button>
      </nav>
    </header>
    <main id="view"></main>
    <div id="toast" class="toast hidden"></div>
  </div>
</body>
</html>
